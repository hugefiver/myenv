# 这是 Hyprland 的主体配置，按键单独放在 keybinds.conf，方便你直接改。

$mod = SUPER
$terminal = wezterm
$fileManager = dolphin
$menu = rofi -show drun -show-icons

exec-once = ~/.config/hypr/autostart.sh

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = NIXOS_OZONE_WL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Hyprland 不支持 Qt text-input-v2（仅 KWin 支持），
# 必须通过 fcitx IM module 为 Qt/GTK 应用提供输入法。
env = QT_IM_MODULE,fcitx
env = QT_IM_MODULES,wayland;fcitx
env = GTK_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx

input {
	kb_layout = us
	kb_options = ctrl:swapcaps
	follow_mouse = 1
	repeat_rate = 45
	repeat_delay = 280

	touchpad {
		natural_scroll = yes
		tap-to-click = yes
		scroll_factor = 0.9
	}
}

general {
	gaps_in = 8
	gaps_out = 16
	border_size = 1
	layout = dwindle
	resize_on_border = true
	allow_tearing = false
	col.active_border = rgba(dba86bcc)
	col.inactive_border = rgba(e6ddd40a)
}

decoration {
	rounding = 14
	active_opacity = 0.97
	inactive_opacity = 0.92
	fullscreen_opacity = 1.0
	dim_inactive = true
	dim_strength = 0.06

	shadow {
		enabled = true
		range = 20
		render_power = 2
		color = rgba(1a120a48)
		color_inactive = rgba(1a120a20)
	}

	blur {
		enabled = true
		size = 8
		passes = 3
		new_optimizations = true
		xray = true
		noise = 0.01
		contrast = 0.92
		brightness = 0.92
		vibrancy = 0.15
	}
}

group {
	col.border_active = rgba(dba86bcc)
	col.border_inactive = rgba(e6ddd40a)

	groupbar {
		font_family = Noto Sans
		font_size = 11
		height = 22
		col.active = rgba(dba86b44)
		col.inactive = rgba(2a252088)
		text_color = rgba(e6ddd4ff)
	}
}

animations {
	enabled = yes

	# Material Design 3 风格贝塞尔曲线
	bezier = md3_decel, 0.05, 0.7, 0.1, 1
	bezier = md3_accel, 0.3, 0, 0.8, 0.15
	bezier = overshot, 0.05, 0.9, 0.1, 1.05
	bezier = smoothOut, 0.36, 0, 0.66, -0.56
	bezier = smoothIn, 0.25, 1, 0.5, 1

	animation = windows, 1, 5, md3_decel, popin 60%
	animation = windowsIn, 1, 5, md3_decel, popin 60%
	animation = windowsOut, 1, 4, md3_accel, popin 60%
	animation = windowsMove, 1, 4, md3_decel
	animation = border, 1, 10, default
	animation = borderangle, 1, 120, smoothIn, loop
	animation = fade, 1, 4, md3_decel
animation = layers, 1, 2, md3_decel, popin 80%
	animation = workspaces, 1, 5, md3_decel, slide
	animation = specialWorkspace, 1, 4, md3_decel, slidefadevert -20%
}

dwindle {
	preserve_split = true
	# smart_split 会基于光标四象限决定切分方向，会覆盖 force_split；
	# 这里固定使用 force_split=2（新窗口在右/下），避免冲突。
	force_split = 2
}

master {
	new_status = master
	mfact = 0.7
}

misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
	focus_on_activate = true
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
	# 注：旧版 misc:vfr 已被移除（迁移到 debug:vfr，默认开启），无需再写。
}

# DisplayLink (evdi) 唯一输出：硬件光标无法 scan-out 到 evdi，
# Auto 模式下的回退路径反而引入抖动；显式强制软光标 + 60Hz 重绘节奏。
# 关闭三缓冲与 explicit sync，去掉 USB scanout 路径上的额外延迟。
cursor {
	no_hardware_cursors = true
	min_refresh_rate = 60
}
render {
	new_render_scheduling = false
	explicit_sync = 0
	explicit_sync_kms = 0
}

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Layer Rules ──────────────────────────────────────────────
# waybar / rofi / wlogout 等 layer shell 表面的毛玻璃效果
# v3 语法：layerrule = effect [arg], match:namespace ^...$
# 注意 ignorealpha 已改名 ignore_alpha
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar)$
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.3, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 0.3, match:namespace ^(logout_dialog)$

bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

plugin {
	hyprexpo {
		columns = 3
		gap_size = 8
		bg_col = rgba(1e1b18ee)
		workspace_method = center current
	}
}

# hypridle：空闲自动锁屏 / 关屏 / 挂起
# 时间单位：秒

general {
    lock_cmd = pidof hyprlock || hyprlock    # 避免重复启动
    before_sleep_cmd = loginctl lock-session  # 挂起前先锁屏
    after_sleep_cmd = hyprctl dispatch dpms on  # 唤醒后开屏
}

# 5 分钟无操作 → 锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 分钟无操作 → 关闭显示器（DPMS off）
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 分钟无操作 → 挂起
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

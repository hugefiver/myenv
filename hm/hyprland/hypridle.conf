# hypridle：空闲自动锁屏 / 关屏
# 时间单位：秒

general {
    lock_cmd = pidof hyprlock || hyprlock    # 避免重复启动
    before_sleep_cmd = loginctl lock-session  # 挂起前先锁屏
    after_sleep_cmd = hyprctl dispatch dpms on  # 唤醒后开屏
}

# 4 分 45 秒无操作 → 屏幕变暗（锁屏前 15 秒预警）
listener {
    timeout = 285
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 分钟无操作 → 锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 分钟无操作 → 关闭显示器（DPMS off）
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

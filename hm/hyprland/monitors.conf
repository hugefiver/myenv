# 多显示器配置单独放在这里，改这一份就行。
# 查看当前输出名：hyprctl monitors all
# 快速查看布局：wlr-randr
# transform: 0=横屏, 1=顺时针90°, 2=180°, 3=逆时针90°

# 默认：所有显示器自动启用，自动分辨率和位置。
monitor = , preferred, auto, auto

# ── Dell U2720QM 双屏布局 ─────────────────────────────────────
# 横屏主屏（序列号 60PZCH3）：左侧，1.25x 缩放
monitor = desc:Dell Inc. DELL U2720QM 60PZCH3, preferred, 0x0, 1.25

# 竖屏副屏（序列号 FCV0DH3）：右侧，逆时针90°旋转，1.25x 缩放
# 3072 = 3840 / 1.25（横屏缩放后的逻辑宽度）
monitor = desc:Dell Inc. DELL U2720QM FCV0DH3, preferred, 3072x0, 1.25, transform, 3

# 工作区绑定：1~5 横屏，6~10 竖屏
workspace = 1, monitor:desc:Dell Inc. DELL U2720QM 60PZCH3, default:true
workspace = 2, monitor:desc:Dell Inc. DELL U2720QM 60PZCH3
workspace = 3, monitor:desc:Dell Inc. DELL U2720QM 60PZCH3
workspace = 4, monitor:desc:Dell Inc. DELL U2720QM 60PZCH3
workspace = 5, monitor:desc:Dell Inc. DELL U2720QM 60PZCH3
workspace = 6, monitor:desc:Dell Inc. DELL U2720QM FCV0DH3, default:true
workspace = 7, monitor:desc:Dell Inc. DELL U2720QM FCV0DH3
workspace = 8, monitor:desc:Dell Inc. DELL U2720QM FCV0DH3
workspace = 9, monitor:desc:Dell Inc. DELL U2720QM FCV0DH3
workspace = 10, monitor:desc:Dell Inc. DELL U2720QM FCV0DH3

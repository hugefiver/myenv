# 多显示器配置单独放在这里，改这一份就行。
# 查看当前输出名：hyprctl monitors all
# 快速查看布局：wlr-randr
# transform: 0=横屏, 1=顺时针90°, 2=180°, 3=逆时针90°

# 默认：所有显示器自动启用，位置由 Hyprland 自动安排。
# AQ_DRM_DEVICES 在 env-hyprland 中已指定 Intel iGPU + DisplayLink，
# Hyprland 启动时会扫描这两个 DRM 设备上的所有输出。
monitor = , preferred, auto, auto

# DisplayLink 显示器通常报告为 DP-N 或 HDMI-A-N（取决于底座接口），
# 用 hyprctl monitors all 确认实际名称后可改为精确配置：
# monitor = DP-3, 1920x1080@60, 2560x0, 1

# 竖屏示例（把 desc/name 改成你自己的输出）：
# monitor = desc:Dell Inc. DELL U2415 01234567, preferred, 2560x0, 1, transform, 1

# 双显示器示例：
# monitor = HDMI-A-1, preferred, 0x0, 1
# monitor = DP-1, preferred, 2560x0, 1

# 你也可以加工作区绑定，例如：
# workspace = 1, monitor:HDMI-A-1, default:true
# workspace = 2, monitor:DP-1

# clash-verge 在不同打包/版本下 class 可能是 "clash-verge" / "Clash Verge" /
# "io.github.clash-verge-rev.clash-verge-rev" 等；用宽匹配。
# Tauri/WebKitGTK 应用 map 时常用临时 app_id，之后才 set_app_id 改名；
# 因此同时匹配 initial_class（开机第一次直接命中）和 class（晚改名时再次应用）。
windowrule = float on, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = size 35% 50%, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = center on, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = border_size 0, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = suppress_event maximize fullscreen, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = float on, match:class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = size 35% 50%, match:class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = center on, match:class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = border_size 0, match:class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = suppress_event maximize fullscreen, match:class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$


windowrule = border_size 0, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = suppress_event maximize fullscreen, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$


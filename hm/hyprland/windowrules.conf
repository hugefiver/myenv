# ── 对话框 / 弹窗自动浮动 ────────────────────────────────────
# xdg-desktop-portal 实现（GTK / KDE / Hyprland 三方）
windowrule = float, match:class ^(xdg-desktop-portal-.*)$
windowrule = float, match:class ^(org\.freedesktop\.impl\.portal\.desktop\..*)$
# KDE 原生对话框（kdialog）/ GTK zenity / yad
windowrule = float, match:class ^(org\.kde\.kdialog)$
windowrule = float, match:class ^(kdialog)$
windowrule = float, match:class ^(zenity)$
windowrule = float, match:class ^(yad)$
# GTK / Qt 文件选择器普遍以 title 为特征（class 跟随宿主应用）
windowrule = float, match:title ^(Open File)$
windowrule = float, match:title ^(Open Folder)$
windowrule = float, match:title ^(Open Files)$
windowrule = float, match:title ^(Save As)$
windowrule = float, match:title ^(Save File)$
windowrule = float, match:title ^(Choose File)(.*)$
windowrule = float, match:title ^(Select File)(.*)$
windowrule = float, match:title ^(File Upload)$
windowrule = float, match:title ^(打开)$
windowrule = float, match:title ^(打开文件)(.*)$
windowrule = float, match:title ^(打开文件夹)$
windowrule = float, match:title ^(选择文件)(.*)$
windowrule = float, match:title ^(选取文件)(.*)$
windowrule = float, match:title ^(保存)$
windowrule = float, match:title ^(另存为)$
windowrule = float, match:title ^(Confirm)(.*)$
windowrule = float, match:title ^(确认)(.*)$
# 浏览器文件上传/下载弹窗
windowrule = float, match:title ^(.*) - 选择文件$
windowrule = float, match:title ^(.*) - File Upload$


# clash-verge 在不同打包/版本下 class 可能是 "clash-verge" / "Clash Verge" /
# "io.github.clash-verge-rev.clash-verge-rev" 等；用 initial_class + 宽匹配。
windowrule = float, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$
windowrule = size 35% 50%, match:initial_class ^([Cc]lash[- ][Vv]erge.*|io\.github\.clash-verge-rev\..*)$

# ── VSCode 毛玻璃 ─────────────────────────────────────────────
# 全局 opacity=1.0 后，VSCode 默认完全不透明。这里单独给它加 0.85 整窗
# 透明度，Hyprland 会自动对透明区域跑 blur，得到与 wezterm 类似的毛玻璃。
# 注意：是 Hyprland 合成层透明，VSCode 内部 UI/文字一起被乘 alpha；
# 如果觉得文字偏淡，把 0.85 调高（如 0.92）。
windowrule = opacity 0.85 0.80, match:class ^([Cc]ode|[Cc]ode-[Uu]rl-[Hh]andler|[Cc]ode-[Oo]ss|VSCodium)$

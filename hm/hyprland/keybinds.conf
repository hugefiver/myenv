# Emacs 风格的 Super 键位放在这里，方便你自己继续改。

$mod = SUPER

bind = $mod, Return, exec, wezterm
bind = $mod, Space, exec, rofi -show drun
bind = $mod SHIFT, Space, exec, rofi -show window
bind = $mod, I, exec, emacsclient -c -a emacs
bind = $mod, M, exec, $fileManager
bind = $mod, W, exec, rofi -show window
bind = $mod, K, killactive
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, K, exit
bind = $mod SHIFT, Q, exec, wlogout
bind = $mod SHIFT, W, exec, nm-connection-editor
bind = $mod SHIFT, M, exec, emacsclient -c -a emacs ~/.config/hypr/monitors.conf
bind = $mod, V, togglefloating
bind = $mod, C, exec, cliphist list | rofi -dmenu -p "📋 Clipboard" | cliphist decode | wl-copy
bind = $mod, T, togglesplit
bind = $mod, Tab, cyclenext
bind = $mod SHIFT, Tab, cyclenext, prev

# ── 截屏 (grimblast) ────────────────────────────────────────
bind = , Print, exec, grimblast --notify copysave area
bind = SHIFT, Print, exec, grimblast --notify copysave active
bind = $mod, Print, exec, grimblast --notify copysave screen
bind = CTRL, Print, exec, grim -g "$(slurp)" - | swappy -f -

# ── 录屏 (wf-recorder) ─────────────────────────────────────
bind = $mod, R, exec, ~/.config/hypr/scripts/record-toggle.sh

# Emacs-ish navigation: Super-b/f/p/n
bind = $mod, B, movefocus, l
bind = $mod, F, movefocus, r
bind = $mod, P, movefocus, u
bind = $mod, N, movefocus, d

# Move windows with Super-Shift-b/f/p/n
bind = $mod SHIFT, B, movewindow, l
bind = $mod SHIFT, F, movewindow, r
bind = $mod SHIFT, P, movewindow, u
bind = $mod SHIFT, N, movewindow, d

# Super-a/e 模拟“向前/向后翻页”式的工作区切换
bind = $mod, A, workspace, e-1
bind = $mod, E, workspace, e+1
bind = $mod SHIFT, A, movetoworkspace, e-1
bind = $mod SHIFT, E, movetoworkspace, e+1

# 保留数字工作区
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# 类似 Emacs 的 Super-x 前缀子图
bind = $mod, X, submap, emacs-x

submap = emacs-x
bind = , B, exec, rofi -show window
bind = , D, exec, rofi -show drun
bind = , I, exec, emacsclient -c -a emacs
bind = , F, exec, dolphin
bind = , K, killactive
bind = , L, exec, hyprlock
bind = , M, exec, emacsclient -c -a emacs ~/.config/hypr/monitors.conf
bind = , N, exec, nm-connection-editor
bind = , C, exec, cliphist list | rofi -dmenu -p "📋 Clipboard" | cliphist decode | wl-copy
bind = , P, exec, wlogout
bind = , R, exec, hyprctl reload
bind = , S, exec, systemctl suspend
bind = , V, exec, ~/.config/hypr/scripts/record-toggle.sh
bind = , Return, exec, wezterm
bind = , Escape, submap, reset
bind = , catchall, submap, reset

submap = reset

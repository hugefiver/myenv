# Emacs 风格的 Super 键位放在这里，方便你自己继续改。

$mod = SUPER

bind = $mod, Return, exec, wezterm
bind = $mod, Space, exec, ~/.config/hypr/scripts/rofi-launcher.sh
bind = $mod SHIFT, Space, exec, rofi -show window
bind = $mod, I, exec, emacsclient -c -a emacs
bind = $mod, M, exec, $fileManager
bind = $mod, W, exec, rofi -show window
bind = $mod, K, killactive,
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, K, exec, uwsm stop
bind = $mod SHIFT, Q, exec, ~/.config/hypr/scripts/power-menu.sh
bind = $mod SHIFT, W, exec, nm-connection-editor
bind = $mod SHIFT, M, exec, emacsclient -c -a emacs ~/.config/hypr/monitors.conf
bind = $mod, V, togglefloating,
bind = $mod, C, exec, cliphist list | rofi -dmenu -p "📋 Clipboard" | cliphist decode | wl-copy
bind = $mod, slash, exec, ~/.config/hypr/scripts/keybind-cheatsheet.sh
bind = $mod, backslash, exec, pkill -SIGUSR1 -f waybar-autohide
bind = $mod, T, layoutmsg, togglesplit
bind = $mod, D, exec, rofi -show window
bind = $mod, Tab, exec, bash -c 'l=$(hyprctl activeworkspace -j|jq -r .layout 2>/dev/null);case ${l:-master} in master)hyprctl dispatch layoutmsg swapwithmaster auto;;*)hyprctl dispatch cyclenext;;esac'
bind = $mod SHIFT, Tab, cyclenext, prev

# ── 截屏 (grimblast) ────────────────────────────────────────
bind = , Print, exec, grimblast --freeze --notify copysave area
bind = SHIFT, Print, exec, grimblast --freeze --notify copysave active
bind = $mod, Print, exec, grimblast --freeze --notify copysave screen
bind = CTRL, Print, exec, grimblast --freeze --notify edit area

# ── 录屏 (wf-recorder) ─────────────────────────────────────
bind = $mod, R, exec, ~/.config/hypr/scripts/record-toggle.sh

# Emacs-ish navigation: Super-b/f/p/n
bind = $mod, B, movefocus, l
bind = $mod, F, movefocus, r
bind = $mod, P, movefocus, u
bind = $mod, N, movefocus, d

# Move windows with Super-Shift-b/f/p/n
bind = $mod SHIFT, B, movewindow, l
bind = $mod SHIFT, F, movewindow, r
bind = $mod SHIFT, P, movewindow, u
bind = $mod SHIFT, N, movewindow, d

# ── 方向键导航（镜像 Emacs 键位）────────────────────────────
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

bind = $mod CTRL, Left, workspace, m-1
bind = $mod CTRL, Right, workspace, m+1
bind = $mod CTRL, Up, focusmonitor, -1
bind = $mod CTRL, Down, focusmonitor, +1
bind = $mod CTRL SHIFT, Left, movetoworkspace, m-1
bind = $mod CTRL SHIFT, Right, movetoworkspace, m+1
bind = $mod CTRL SHIFT, Up, movewindow, mon:-1
bind = $mod CTRL SHIFT, Down, movewindow, mon:+1

# ── 调整窗口大小（按住可连续）──────────────────────────────
binde = $mod ALT, Left, resizeactive, -30 0
binde = $mod ALT, Right, resizeactive, 30 0
binde = $mod ALT, Up, resizeactive, 0 -30
binde = $mod ALT, Down, resizeactive, 0 30

# Super-a/e 模拟“向前/向后翻页”式的工作区切换
bind = $mod, A, workspace, m-1
bind = $mod, E, workspace, m+1
bind = $mod SHIFT, A, movetoworkspace, m-1
bind = $mod SHIFT, E, movetoworkspace, m+1
bind = $mod CTRL, A, focusmonitor, -1
bind = $mod CTRL, E, focusmonitor, +1
bind = $mod CTRL SHIFT, A, movewindow, mon:-1
bind = $mod CTRL SHIFT, E, movewindow, mon:+1
bind = $mod, equal, workspace, emptym

# 保留数字工作区
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# ── 窗口分组（标签页模式）────────────────────────────────────
bind = $mod, G, togglegroup,
bind = $mod, period, changegroupactive, f
bind = $mod, comma, changegroupactive, b
bind = $mod SHIFT, G, moveoutofgroup,

# ── 布局切换 ──────────────────────────────────────────────────
bind = $mod, F10, exec, bash -c 'ws=$(hyprctl activeworkspace -j|jq -r .id);mon=$(hyprctl activeworkspace -j|jq -r .monitor);case "$mon" in DVI-I-1)o=left;;*)o=top;;esac;hyprctl --batch "keyword general:layout master ; keyword master:orientation $o ; keyword workspace $ws,layout:master";notify-send -t 1000 "布局" "Master ($o)"'
bind = $mod, F11, exec, bash -c 'ws=$(hyprctl activeworkspace -j|jq -r .id);hyprctl --batch "keyword general:layout dwindle ; keyword workspace $ws,layout:dwindle";notify-send -t 1000 "布局" "Dwindle"'
bind = $mod, F12, layoutmsg, swapwithmaster auto
bind = $mod, F9, exec, bash -c 'ws=$(hyprctl activeworkspace -j|jq -r .id);f=/tmp/hypr-orient-$ws;c=$(<"$f" 2>/dev/null)||c=left;case $c in left)n=right;;right)n=top;;top)n=bottom;;*)n=left;;esac;echo $n>"$f";hyprctl keyword "workspace $ws,layoutopt:orientation:$n";notify-send -t 1000 "Master 方向" "$n"'

# 类似 Emacs 的 Super-x 前缀子图
bind = $mod, X, submap, emacs-x

submap = emacs-x
bind = , B, exec, rofi -show window
bind = , D, exec, rofi -show drun
bind = , I, exec, emacsclient -c -a emacs
bind = , F, exec, dolphin
bind = , K, killactive,
bind = , L, exec, hyprlock
bind = , M, exec, emacsclient -c -a emacs ~/.config/hypr/monitors.conf
bind = , N, exec, nm-connection-editor
bind = , C, exec, cliphist list | rofi -dmenu -p "📋 Clipboard" | cliphist decode | wl-copy
bind = , H, exec, ~/.config/hypr/scripts/keybind-cheatsheet.sh
bind = , P, exec, ~/.config/hypr/scripts/power-menu.sh
bind = , R, exec, hyprctl reload
bind = , S, exec, systemctl suspend
bind = , V, exec, ~/.config/hypr/scripts/record-toggle.sh
bind = , Return, exec, wezterm
bind = , Escape, submap, reset
bind = , catchall, submap, reset

submap = reset

# 锁屏样式单独放在这里，方便你直接改配色、字体和位置。

general {
	hide_cursor = true
	grace = 2
}

background {
	monitor =
	path = screenshot
	blur_passes = 3
	blur_size = 8
	noise = 0.02
	contrast = 0.95
	brightness = 0.82
	vibrancy = 0.2
	vibrancy_darkness = 0.2
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +'%H:%M')"
	color = rgba(eef2ffff)
	font_size = 82
	font_family = CaskaydiaCove Nerd Font Mono
	position = 0, 140
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:60000] echo "$(date +'%Y-%m-%d %A')"
	color = rgba(cdd6f4dd)
	font_size = 22
	font_family = CaskaydiaCove Nerd Font Mono
	position = 0, 78
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 300, 56
	outline_thickness = 2
	dots_size = 0.22
	dots_spacing = 0.18
	dots_center = true
	outer_color = rgba(89b4faff)
	inner_color = rgba(1e1e2ecc)
	font_color = rgba(cdd6f4ff)
	fade_on_empty = false
	placeholder_text = <i>Input Password...</i>
	hide_input = false
	rounding = 18
	check_color = rgba(a6e3a1ff)
	fail_color = rgba(f38ba8ff)
	capslock_color = rgba(f9e2afff)
	position = 0, -40
	halign = center
	valign = center
}
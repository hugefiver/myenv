general {
	hide_cursor = true
	grace = 2
}

background {
	monitor =
	path = screenshot
	blur_passes = 3
	blur_size = 8
	noise = 0.01
	contrast = 0.92
	brightness = 0.78
	vibrancy = 0.1
	vibrancy_darkness = 0.1
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +'%H:%M')"
	color = rgba(e4e4e8ff)
	font_size = 80
	font_family = CaskaydiaCove Nerd Font Mono
	position = 0, 140
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:60000] echo "$(date +'%Y-%m-%d %A')"
	color = rgba(b0b0bacc)
	font_size = 20
	font_family = CaskaydiaCove Nerd Font Mono
	position = 0, 78
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 280, 50
	outline_thickness = 1
	dots_size = 0.2
	dots_spacing = 0.18
	dots_center = true
	outer_color = rgba(60a5facc)
	inner_color = rgba(1a1a22cc)
	font_color = rgba(e4e4e8ff)
	fade_on_empty = false
	placeholder_text = <i>输入密码...</i>
	hide_input = false
	rounding = 10
	check_color = rgba(86efacff)
	fail_color = rgba(f87171ff)
	capslock_color = rgba(fcd34dff)
	position = 0, -40
	halign = center
	valign = center
}

general {
	hide_cursor = true
	# 新版 hyprlock 已移除 general:grace 字段，仅保留 CLI 参数 `--grace SECONDS`。
	# 如需 grace period，请在调用方加 `hyprlock --grace 2`。
}

background {
	monitor =
	path = screenshot
	blur_passes = 3
	blur_size = 8
	noise = 0.01
	contrast = 0.90
	brightness = 0.72
	vibrancy = 0.12
	vibrancy_darkness = 0.1
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +'%H:%M')"
	color = rgba(e6ddd4ff)
	font_size = 80
	font_family = Noto Sans
	position = 0, 140
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:60000] echo "$(date +'%-m月%-d日 %A')"
	color = rgba(968b80cc)
	font_size = 20
	font_family = Noto Sans
	position = 0, 78
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 280, 50
	outline_thickness = 1
	dots_size = 0.2
	dots_spacing = 0.18
	dots_center = true
	outer_color = rgba(dba86bcc)
	inner_color = rgba(1e1b18cc)
	font_color = rgba(e6ddd4ff)
	fade_on_empty = false
	placeholder_text = <i>输入密码...</i>
	hide_input = false
	rounding = 14
	check_color = rgba(a8c686ff)
	fail_color = rgba(f28b82ff)
	capslock_color = rgba(fcd34dff)
	position = 0, -40
	halign = center
	valign = center
}
